plugins {
    id "fabric-loom" version "1.10.+"
    id "com.gradleup.shadow" version "8.3.6"
    id "ploceus" version "1.10.+"
    id "maven-publish"
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
}

base {
    archivesName = rootProject.archives_base_name + "-ornithe"
}

version = rootProject.mod_version
group = rootProject.maven_group

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven { url "https://moehreag.duckdns.org/maven/releases" }
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url 'https://repo.sleeping.town/' }
    maven { url 'https://maven.is-quite.gay/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // The following line declares the mojmap mappings, you may use other mappings as well
    mappings ploceus.featherMappings(project.feather_build)

    ploceus.dependOsl(project.osl_version)

    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation("io.netty.incubator:netty-incubator-codec-classes-quic:${rootProject.quic_version}") {
        exclude(group: "io.netty")
    }

    shadowCommon(implementation("io.netty.incubator:netty-incubator-codec-classes-quic:${rootProject.quic_version}") {
        exclude(group: "io.netty")
    })

    // Dependencies for commands
    implementation include("com.mojang:brigadier:1.0.18")
    modLocalRuntime("io.github.moehreag:legacy-lwjgl3:${project.property("legacy_lwgjl3")}:all-remapped")

    // Netty dependencies.. oh well
    shadowCommon(implementation("io.netty:netty-buffer:${project.netty_version}"))
    shadowCommon(implementation("io.netty:netty-codec:${project.netty_version}"))
    shadowCommon(implementation("io.netty:netty-common:${project.netty_version}"))
    shadowCommon(implementation("io.netty:netty-handler:${project.netty_version}"))
    shadowCommon(implementation("io.netty:netty-resolver:${project.netty_version}"))
    shadowCommon(implementation("io.netty:netty-transport:${project.netty_version}"))
    shadowCommon(implementation("io.netty:netty-transport-classes-epoll:${project.netty_version}"))
    shadowCommon(implementation("io.netty:netty-transport-native-epoll:${project.netty_version}:linux-x86_64"))
    shadowCommon(implementation("io.netty:netty-transport-native-epoll:${project.netty_version}:linux-aarch_64"))
    shadowCommon(implementation("io.netty:netty-transport-native-unix-common:${project.netty_version}"))
}

configurations.configureEach {
    resolutionStrategy {
        dependencySubstitution {
            substitute(module("io.netty:netty-all:4.0.23.Final")).using(module("io.netty:netty-all:${project.netty_version}"))
        }
        force("io.netty:netty-all:${project.netty_version}")
        dependencySubstitution {
            substitute(module("com.mojang:netty:1.8.8")).using(module("com.mojang:patchy:2.2.10"))
        }
        force("com.mojang:patchy:2.2.10")
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 17
}

java {
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}


components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        /*maven {
            url "https://sg.storage.bunnycdn.com/skyeven"
            credentials(HttpHeaderCredentials) {
                name = "AccessKey"
                value = property("skyevenToken")
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }*/
    }
}

